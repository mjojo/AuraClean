# AuraClean Declarative Cleaning Rules — Gaming & Shader Pipelines
# Maintained by mjojo (https://github.com/mjojo/AuraClean)

schema_version = 1
category = "gaming"

[[rule]]
id = "nvidia_dx_cache"
category = "gaming"
safety_level = "Yellow"
quarantine_tier = "DirectDelete"
min_age_hours = 24
paths = [
    "%LOCALAPPDATA%\\NVIDIA\\DXCache\\*",
    "%LOCALAPPDATA%\\NVIDIA\\GLCache\\*"
]
exclude_patterns = ["*.lock"]

[rule.i18n.en]
name = "NVIDIA DirectX & OpenGL Shader Cache"
description = "Compiled GPU shaders. Deleted directly to reclaim gigabytes; games automatically recompile shaders on launch."

[rule.i18n.ru]
name = "NVIDIA — Кэш шейдеров DirectX и OpenGL"
description = "Скомпилированные шейдеры видеокарты. Удаляются напрямую без карантина; игры сами пересоздают их при запуске."

[[rule]]
id = "directx_d3dscache"
category = "gaming"
safety_level = "Yellow"
quarantine_tier = "DirectDelete"
min_age_hours = 24
paths = [
    "%LOCALAPPDATA%\\D3DSCache\\*",
    "%LOCALLOW%\\NVIDIA\\PerDriverVersion\\DXCache\\*"
]
exclude_patterns = []

[rule.i18n.en]
name = "Windows Direct3D & LocalLow Shader Cache"
description = "DirectX 12 shader pipeline cache stored in hidden LocalAppData and LocalLow folders. Deleted directly."

[rule.i18n.ru]
name = "Кэш шейдеров Direct3D и скрытой папки AppData\\LocalLow"
description = "Кэш конвейера шейдеров DirectX 12 в скрытых папках Local и LocalLow. Удаляется напрямую."

[[rule]]
id = "documents_game_crash_logs"
category = "gaming"
safety_level = "Green"
quarantine_tier = "DirectDelete"
min_age_hours = 24
paths = [
    "%DOCUMENTS%\\My Games\\*\\Logs\\*",
    "%DOCUMENTS%\\My Games\\*\\CrashDumps\\*"
]
exclude_patterns = ["*.sav", "*.save", "*save*", "*.cfg", "*.ini"]

[rule.i18n.en]
name = "My Documents — Game Logs & Crash Dumps (SaveGames Shielded)"
description = "Diagnostic game logs and crash dumps inside My Documents (including Cyrillic paths). SaveGames and configs are strictly excluded."

[rule.i18n.ru]
name = "Мои Документы — Логи и дампы игр (Сохранения защищены)"
description = "Логи и дампы вылетов игр в папке «Мои документы» (с поддержкой кириллицы). Файлы сохранений (SaveGames) и настройки строго защищены."

[[rule]]
id = "steam_client_caches"
category = "gaming"
safety_level = "Green"
quarantine_tier = "DirectDelete"
detect_processes = ["steam.exe"]
min_age_hours = 12
paths = [
    "%LOCALAPPDATA%\\Steam\\htmlcache\\Cache\\*",
    "%LOCALAPPDATA%\\Steam\\htmlcache\\Code Cache\\*",
    "%LOCALAPPDATA%\\Steam\\htmlcache\\GPUCache\\*"
]
exclude_patterns = ["*.lock"]

[rule.i18n.en]
name = "Steam Client — Store & Overlay HTML/GPU Cache"
description = "Embedded Chromium cache used by the Steam Store and in-game overlay. Game installations and saves are untouched."

[rule.i18n.ru]
name = "Steam — Кэш магазина и внутриигрового оверлея"
description = "Временный кэш встроенного браузера Steam в скрытой папке LocalAppData. Игры и сохранения не затрагиваются."

[[rule]]
id = "amd_radeon_shader_cache"
category = "gaming"
safety_level = "Yellow"
quarantine_tier = "DirectDelete"
min_age_hours = 24
paths = [
    "%LOCALAPPDATA%\\AMD\\DxCache\\*",
    "%LOCALAPPDATA%\\AMD\\DxcCache\\*",
    "%LOCALAPPDATA%\\AMD\\GLCache\\*",
    "%LOCALAPPDATA%\\AMD\\VkCache\\*"
]
exclude_patterns = ["*.lock"]

[rule.i18n.en]
name = "AMD Radeon — DirectX, Vulkan & OpenGL Shader Cache"
description = "Compiled GPU shader pipelines for AMD Radeon graphics cards. Deleted directly; games recompile as needed."

[rule.i18n.ru]
name = "AMD Radeon — Кэш шейдеров DirectX, Vulkan и OpenGL"
description = "Скомпилированные шейдеры видеокарт AMD Radeon. Удаляются напрямую; пересоздаются играми автоматически."

