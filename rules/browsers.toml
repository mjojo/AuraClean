[[rule]]
id = "telegram_media_cache"
category = "browsers"
safety_level = "Yellow"
quarantine_tier = "DirectDelete"
detect_processes = ["Telegram.exe"]
min_age_hours = 24
paths = [
    "%APPDATA%\\Telegram Desktop\\tdata\\user_data\\cache\\*",
    "%APPDATA%\\Telegram Desktop\\tdata\\user_data\\media_cache\\*"
]
exclude_patterns = ["*.lock"]

[rule.i18n.en]
name = "Telegram Desktop — Downloaded Media & Web Cache"
description = "Cached chat media and web previews inside Telegram Desktop. Cloud messages stay in Telegram and re-download on click."

[rule.i18n.ru]
name = "Telegram Desktop — Кэш медиафайлов и превью"
description = "Кэшированные фото и видео из чатов Telegram. Сами переписки и аккаунт не затрагиваются (файлы подгружаются из облака)."
