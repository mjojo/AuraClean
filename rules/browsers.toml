# AuraClean Declarative Cleaning Rules — Web Browsers
# Maintained by mjojo (https://github.com/mjojo/AuraClean)

schema_version = 1
category = "browsers"

[[rule]]
id = "chrome_web_cache"
category = "browsers"
safety_level = "Green"
quarantine_tier = "DirectDelete"
detect_processes = ["chrome.exe"]
min_age_hours = 2
paths = [
    "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\Cache\\Cache_Data\\*",
    "%LOCALAPPDATA%\\Google\\Chrome\\User Data\\*\\Code Cache\\*"
]
exclude_patterns = ["*.lock", "index"]

[rule.i18n.en]
name = "Google Chrome — Web & Code Cache"
description = "Temporary copies of website images and compiled scripts. Deleted directly; passwords and active logins are never touched."

[rule.i18n.ru]
name = "Google Chrome — Кэш веб-страниц и скриптов"
description = "Временные копии картинок и скриптов с сайтов. Удаляются напрямую; пароли и активные сессии не затрагиваются."

